[workspace]
resolver = "2"
exclude = ["acceptance/chromium"]
members = [
  "crates/reader-core",
  "crates/reader-application",
  "crates/reader-collectors",
  "crates/reader-ingest",
  "crates/reader-storage-ydb",
  "crates/reader-server-contracts",
  "crates/reader-server",
  "crates/reader-server-ui",
  "crates/reader-web-runtime",
  "crates/inoreader",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1"
argon2 = "0.5"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
feed-rs = "2"
http = "1"
murmur3 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rand = "0.8"
rpassword = "7"
roxmltree = "0.20"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace", "timeout"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4", "v5"] }
ydb = "=0.18.0"
