name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: python3 scripts/test_affected.py
      - run: python3 scripts/check_crate_boundaries.py
      - run: ruby tools/validate_source_inventory.rb source-inventory/inventory.json
      - run: python3 tools/validate_seed_manifest.py --inventory-only source-inventory/inventory.json
      - run: python3 tools/check_operational_assets.py

  release-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - run: bash tools/run_chromium_acceptance.sh
      - run: npm test
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - run: ./tools/test_ydb_backup_restore.sh
      - run: python3 tools/check_operational_assets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-artifacts
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: warn
