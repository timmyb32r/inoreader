services:
  proxy:
    image: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    network_mode: host
    environment:
      EXTERNAL_HOST: ${EXTERNAL_HOST:?set EXTERNAL_HOST to the public DNS name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
  app:
    build: .
    command: ["--config", "/etc/inoreader/config.yaml", "serve"]
    environment:
      YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS: /run/secrets/ydb-key.json
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    volumes:
      - ./config.yaml:/etc/inoreader/config.yaml:ro
    secrets:
      - source: ydb-key
        target: ydb-key.json
      - source: postgres-password
        target: postgres-password
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      chromium:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/live"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    networks:
      - public-egress
      - browser-control
      - database
  postgres:
    image: postgres:17-bookworm@sha256:91eb910c44c7ed13f7f1a4ccadaa9ca72ef14cddc04cacb6e070e48eb44731a3
    environment:
      POSTGRES_DB: inoreader
      POSTGRES_USER: inoreader
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - source: postgres-password
        target: postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inoreader -d inoreader"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      - database
  chromium:
    image: chromedp/headless-shell@sha256:2d349b544a1ea6b5b5fd7c0fe99215ff662339c57407ee2e8c0a11af93516b04
    command: ["--remote-allow-origins=*"]
    expose: ["9222"]
    healthcheck:
      # The pinned headless-shell image intentionally has no curl or wget. Its
      # entrypoint exposes CDP through a local socat proxy, so probe that port.
      test: ["CMD-SHELL", "timeout 2 socat /dev/null TCP:127.0.0.1:9222,connect-timeout=2"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/chrome:size=64m,mode=0700
    shm_size: 256mb
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    # Chromium has no route to the public internet. Every HTTP(S) request is
    # intercepted over CDP and fulfilled by the app's validated outbound client.
    # The context-level black-hole proxy remains a second fail-closed barrier.
    networks:
      - browser-control
secrets:
  ydb-key:
    file: ./secrets/ydb-key.json
  postgres-password:
    file: ./secrets/postgres-password

volumes:
  caddy-data:
  caddy-config:
  postgres-data:

networks:
  public-egress:
    name: inoreader-public-egress
  browser-control:
    name: inoreader-browser-control
    internal: true
  database:
    name: inoreader-database
    internal: true
