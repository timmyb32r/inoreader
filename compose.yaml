services:
  proxy:
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-50m}
        max-file: "${CONTAINER_LOG_MAX_FILES:-3}"
    image: caddy@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    network_mode: host
    environment:
      EXTERNAL_HOST: ${EXTERNAL_HOST:?set EXTERNAL_HOST to the public DNS name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
  app:
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-50m}
        max-file: "${CONTAINER_LOG_MAX_FILES:-3}"
    build: .
    stop_grace_period: ${CONTAINER_STOP_GRACE_SECONDS:-720}s
    command: ["--config", "/etc/inoreader/config.yaml", "serve"]
    environment:
      CONTAINER_STOP_GRACE_SECONDS: ${CONTAINER_STOP_GRACE_SECONDS:-720}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      AI_ENCRYPTION_KEY_FILE: /run/secrets/ai-encryption-key
    volumes:
      - ./config.yaml:/etc/inoreader/config.yaml:ro
      - ./prompts:/etc/inoreader/prompts:ro
    secrets:
      - source: postgres-password
        target: postgres-password
      - source: ai-encryption-key
        target: ai-encryption-key
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      chromium:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/live"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    networks:
      - public-egress
      - browser-control
      - database
  postgres:
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-50m}
        max-file: "${CONTAINER_LOG_MAX_FILES:-3}"
    image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    environment:
      POSTGRES_DB: inoreader
      POSTGRES_USER: inoreader
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - source: postgres-password
        target: postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inoreader -d inoreader"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks:
      - database
  chromium:
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-50m}
        max-file: "${CONTAINER_LOG_MAX_FILES:-3}"
    image: chromedp/headless-shell@sha256:3da74b0945e4f80f00f0310bcda9f76cee283539ebd200a053a7bebf3de89423
    command: ["--remote-allow-origins=*"]
    expose: ["9222"]
    healthcheck:
      # The pinned headless-shell image intentionally has no curl or wget. Its
      # entrypoint exposes CDP through a local socat proxy, so probe that port.
      test: ["CMD-SHELL", "timeout 2 socat /dev/null TCP:127.0.0.1:9222,connect-timeout=2"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/chrome:size=64m,mode=0700
    shm_size: 256mb
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    # Chromium has no route to the public internet. Every HTTP(S) request is
    # intercepted over CDP and fulfilled by the app's validated outbound client.
    # The context-level black-hole proxy remains a second fail-closed barrier.
    networks:
      - browser-control
secrets:
  postgres-password:
    file: ./secrets/postgres-password
  ai-encryption-key:
    # Exactly 32 random bytes; back up separately from the PostgreSQL database.
    file: ./secrets/ai-encryption-key

volumes:
  caddy-data:
  caddy-config:
  postgres-data:

networks:
  public-egress:
    name: inoreader-public-egress
  browser-control:
    name: inoreader-browser-control
    internal: true
  database:
    name: inoreader-database
    internal: true
