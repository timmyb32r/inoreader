[package]
name = "reader-ai"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
schemars = { version = "1.2.2", optional = true, features = ["chrono04", "uuid1"] }
reader-runtime = { path = "../reader-runtime" }
async-trait.workspace = true
chrono.workspace = true
http.workspace = true
log.workspace = true
reader-web-runtime = { path = "../reader-web-runtime" }
reader-glossary = { path = "../reader-glossary" }
ring = "0.17"
scraper = "0.24"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[features]
schema = ["dep:schemars", "reader-glossary/schema"]

[[bin]]
name = "export_ai_contracts"
path = "src/bin/export_ai_contracts.rs"
required-features = ["schema"]
