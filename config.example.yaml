server:
  bind: "0.0.0.0:8080"
  external_origin: "https://reader.example.com"
  request_timeout_seconds: 30
  graceful_shutdown_seconds: 20
  max_request_body_bytes: 2097152
database:
  postgres:
    host: "postgres"
    port: 5432
    database: "inoreader"
    username: "inoreader"
    password_file_env: "POSTGRES_PASSWORD_FILE"
    max_connections: 16
    acquire_timeout_seconds: 10
  migration_source_ydb:
    endpoint: "grpcs://ydb.example.net:2135"
    database_path: "/region/project/database"
    credentials_env: "YDB_SERVICE_ACCOUNT_KEY_FILE_CREDENTIALS"
    request_timeout_seconds: 15
    max_concurrency: 32
    retry_attempts: 5
    retry_initial_backoff_milliseconds: 200
auth:
  session_lifetime_seconds: 2592000
  invite_lifetime_seconds: 86400
  reset_lifetime_seconds: 3600
  login_attempts_per_minute: 10
  # Argon2id resource costs are validated at startup and embedded in new hashes.
  argon2id_memory_kib: 19456
  argon2id_time_cost: 2
  argon2id_parallelism: 1
http:
  user_agent: "inoreader/0.1"
  connect_timeout_seconds: 10
  request_timeout_seconds: 45
  redirect_hops: 5
  max_body_bytes: 16777216
  max_decompressed_bytes: 67108864
  allowed_plain_http_hosts: []
scheduler:
  polling_interval_seconds: 1800
  queue_poll_interval_seconds: 5
  lease_seconds: 120
  renew_seconds: 40
  workers: 8
  per_origin_concurrency: 2
  retry_attempts: 5
  max_retry_age_seconds: 86400
subscriptions:
  pause_reason_max_bytes: 4096
browser:
  cdp_endpoint: "http://chromium:9222"
  max_contexts: 4
  max_pages_per_context: 1
  navigation_timeout_seconds: 30
  preview_timeout_seconds: 60
  max_actions: 30
  max_downloads: 0
  egress_profile: "public-web-only"
ingest:
  initial_feed_items: 100
  max_web_feed_pages: 10
  batch_items: 100
  max_input_bytes: 16777216
content:
  version_policy: "latest_successful"
  chunk_bytes: 524288
  max_extracted_bytes: 16777216
  media_proxy_enabled: false
observability:
  log_format: "json"
  external_request_metrics: true
  archive_budget_bytes: 107374182400
