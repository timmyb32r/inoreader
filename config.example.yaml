server:
  bind: "0.0.0.0:8080"
  external_origin: "https://reader.example.com"
  request_timeout_seconds: 30
  graceful_shutdown_seconds: 700
  max_request_body_bytes: 2097152
database:
  postgres:
    host: "postgres"
    port: 5432
    database: "inoreader"
    username: "inoreader"
    password_file_env: "POSTGRES_PASSWORD_FILE"
    max_connections: 16
    acquire_timeout_seconds: 10
auth:
  session_lifetime_seconds: 2592000
  invite_lifetime_seconds: 86400
  reset_lifetime_seconds: 3600
  login_attempts_per_minute: 10
  # Argon2id resource costs are validated at startup and embedded in new hashes.
  argon2id_memory_kib: 19456
  argon2id_time_cost: 2
  argon2id_parallelism: 1
http:
  user_agent: "inoreader/0.1"
  connect_timeout_seconds: 10
  request_timeout_seconds: 45
  redirect_hops: 5
  max_body_bytes: 16777216
  max_decompressed_bytes: 67108864
  allowed_plain_http_hosts: []
scheduler:
  polling_interval_seconds: 1800
  queue_poll_interval_seconds: 5
  lease_seconds: 120
  renew_seconds: 40
  workers: 8
  per_origin_concurrency: 2
  retry_attempts: 5
  max_retry_age_seconds: 86400
subscriptions:
  pause_reason_max_bytes: 4096
browser:
  cdp_endpoint: "http://chromium:9222"
  max_contexts: 4
  max_pages_per_context: 1
  navigation_timeout_seconds: 30
  preview_timeout_seconds: 60
  max_actions: 30
  max_downloads: 0
  egress_profile: "public-web-only"
ingest:
  initial_feed_items: 100
  max_web_feed_pages: 10
  batch_items: 100
  max_input_bytes: 16777216
content:
  version_policy: "latest_successful"
  chunk_bytes: 524288
  max_extracted_bytes: 16777216
  media_proxy_enabled: false
observability:
  log_format: "json"
  external_request_metrics: true
  archive_budget_bytes: 107374182400
ai:
  # Set true only after documented operator acceptance (passed evaluation or explicit owner waiver).
  prompt_approved: false
  prompt_path: "/etc/inoreader/prompts/reading-data-news/style.md"
  prompt_version: "reading-data-news-2026-09-27-candidate-04"
  review:
    prompt_path: "/etc/inoreader/prompts/reading-data-news/review.md"
    prompt_version: "reading-data-news-factual-review-2026-09-27-v3"
    model: "deepseek-v4-pro"
    generation_mode:
      kind: thinking
      effort: low
    max_output_tokens: 16384
    input_usd_per_million_tokens: "1.32"
    cached_input_usd_per_million_tokens: "0.044"
    output_usd_per_million_tokens: "3.96"
  enabled_accounts: []
  encryption_key_file_env: "AI_ENCRYPTION_KEY_FILE"
  model: "deepseek-flash"
  generation_mode:
    kind: standard
    temperature: 0.3
  context_tokens: 1048576
  # Conservative UTF-8 byte-token preflight plus explicitly reserved chat framing.
  framing_tokens_per_message: 64
  framing_tokens_base: 128
  max_output_tokens: 16384
  max_input_bytes: 3000000
  max_message_bytes: 65536
  max_response_bytes: 4194304
  request_timeout_seconds: 300
  connect_timeout_seconds: 10
  workers: 2
  poll_milliseconds: 500
  # One claim covers draft and verification; must exceed both request deadlines.
  lease_seconds: 660
  recovery_batch: 32
  # Peak-price estimate; off-peak billing can be lower. Verified 2026-09-27.
  input_usd_per_million_tokens: "0.3"
  cached_input_usd_per_million_tokens: "0.006"
  output_usd_per_million_tokens: "1.2"

# Explicit bounded Telegram history and bot delivery. No bot token in this file.
# Store a dedicated bot token in Settings after creating it via BotFather.
glossary:
  polling_timeout_seconds: 25
  request_timeout_seconds: 45
  connect_timeout_seconds: 10
  lease_seconds: 120
  batch_size: 100
  max_response_bytes: 16777216
  max_archive_line_bytes: 16777216
  retry_initial_seconds: 5
  retry_max_seconds: 300
  public_page_interval_milliseconds: 2000
  history_reconcile_interval_seconds: 21600
  history_pages_per_run: 5
  worker_poll_milliseconds: 1000
  workers: 2
